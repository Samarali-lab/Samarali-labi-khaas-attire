version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: khaas_attire_db
    environment:
      POSTGRES_USER: khaas
      POSTGRES_PASSWORD: khaas_password
      POSTGRES_DB: khaas_attire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: khaas_attire_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
