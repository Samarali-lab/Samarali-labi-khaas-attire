version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: khaas_attire_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-khaas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khaas_password}
      POSTGRES_DB: ${POSTGRES_DB:-khaas_attire}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-khaas_user} -d ${POSTGRES_DB:-khaas_attire}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: khaas_attire_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: khaas_attire_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-khaas_user}:${POSTGRES_PASSWORD:-khaas_password}@postgres:5432/${POSTGRES_DB:-khaas_attire}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
    ports:
      - '3001:3001'
    profiles:
      - production

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: khaas_attire_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - '3000:3000'
    profiles:
      - production

volumes:
  postgres_data:
    name: khaas_attire_postgres_data
  redis_data:
    name: khaas_attire_redis_data
